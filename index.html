<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Bootstrap Project-7</title>
</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center">Skill Tracker</h1>
        <div class="row px-5 pt-4 g-5">
            <div class="col-md-7">
                <h2 class="mb-4">Progress bars</h2>
                <p class="mb-0">HTML</p>
                <div class="progress mb-3" style="height:12px;">
                    <div class="progress-bar bg-success" style="width:90%;">90%</div>
                </div>
                <p class="mb-0">CSS</p>
                <div class="progress mb-3" style="height:12px;">
                    <div class="progress-bar bg-info" style="width:75%;">75%</div>
                </div>
                <p class="mb-0">Bootstrap(striped)</p>
                <div class="progress mb-3" style="height:12px;">
                    <div class="progress-bar bg-warning progress-bar-striped" style="width:60%;">60%</div>
                </div>
                <p class="mb-0">Bootstrap(striped and animated)</p>
                <div class="progress mb-3" style="height:25px;">
                    <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width:30%;">
                        30%</div>
                </div>
                <p class="mb-0">This week (stacked)</p>
                <div class="progress mb-3" style="height:25px;">
                    <div class="progress-bar bg-success progress-bar-animated" style="width:30%;">Done 30%</div>
                    <div class="progress-bar bg-warning progress-bar-animated" style="width:20%;">Doing 20%</div>
                    <div class="progress-bar bg-danger progress-bar-animated" style="width:10%;">10%</div>
                </div>
            </div>
            <div class="col-md-5">
                <h2 class="mb-4">Spinners</h2>
                <p>
                    <span class="spinner-border text-primary"></span>
                    <span class="spinner-border text-success"></span>
                    <span class="spinner-border text-danger"></span>
                    <span class="spinner-border spinner-border-sm text-dark"></span>
                </p>
                <p>
                    <button type="button" class="btn btn-primary">
                        <span class="spinner-border spinner-border-sm"></span> Loading</button>
                    <button type="button" class="btn btn-success">
                        <span class="spinner-grow spinner-grow-sm"></span> Saving</button>
                </p>
                <p class="d-grid">
                    <button type="button" class="btn btn-info text-start"><span class="spinner-border spinner-border-sm"></span>  Uploading your progress</button>
                </p>
            </div>
        </div>
    </div>

</body>

</html>
